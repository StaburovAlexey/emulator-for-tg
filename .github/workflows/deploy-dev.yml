name: deploy-dev
on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Отладка SFTP: показать список в целевой папке
      - name: Debug SFTP list
        run: |
          lftp -e "set net:max-retries 1; set sftp:connect-program 'ssh -a -x -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519'; cls -l /www/dev.emulator-tg.ru; bye" \
            -u "${{ secrets.SSH_USER }}", sftp://"${{ secrets.SSH_HOST }}"

      # Деплой: зеркалим dist -> удалённую папку, удаляем лишнее
      - name: Deploy via SFTP mirror
        run: |
          lftp -e "set net:max-retries 1; set sftp:connect-program 'ssh -a -x -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519'; mirror -R --delete --verbose dist /www/dev.emulator-tg.ru; bye" \
            -u "${{ secrets.SSH_USER }}", sftp://"${{ secrets.SSH_HOST }}"

      # Telegram: успех
      - name: Telegram notify success
        if: ${{ success() }}
        run: |
          COMMIT="${GITHUB_SHA::7}"
          MSG="$(printf "✅ Deploy OK\nrepo: %s\nbranch: %s\ncommit: %s\nauthor: %s\nhost: %s\npath: /www/dev.emulator-tg.ru/\nrun: %s/%s/actions/runs/%s" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$COMMIT" "$GITHUB_ACTOR" "${{ secrets.SSH_HOST }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=$MSG" \
            --data "parse_mode=HTML"

      # Telegram: падение
      - name: Telegram notify failure
        if: ${{ failure() }}
        run: |
          COMMIT="${GITHUB_SHA::7}"
          MSG="$(printf "❌ Deploy FAILED\nrepo: %s\nbranch: %s\ncommit: %s\nauthor: %s\nrun: %s/%s/actions/runs/%s" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$COMMIT" "$GITHUB_ACTOR" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=$MSG" \
            --data "parse_mode=HTML"
